services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_ordering_api}
      POSTGRES_USER: ${POSTGRES_USER:-foodapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodapp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    volumes:
      - postgresdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-foodapp}:${POSTGRES_PASSWORD:-foodapp}@postgres:5432/${POSTGRES_DB:-food_ordering_api}?sslmode=disable",
        "up"
      ]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      FOOD_ORDERING_API_DB_DSN: postgres://${POSTGRES_USER:-foodapp}:${POSTGRES_PASSWORD:-foodapp}@postgres:5432/${POSTGRES_DB:-food_ordering_api}?sslmode=disable
      FOOD_ORDERING_API_PARTNER_KEYS: demo-restaurant=${DEMO_RESTAURANT_API_KEY:-demo-partner-key}
      FOOD_ORDERING_API_REDIS_ADDR: redis:6379
    command:
      [
        "./api",
        "-addr=:8080",
        "-env=development",
        "-db-dsn=postgres://${POSTGRES_USER:-foodapp}:${POSTGRES_PASSWORD:-foodapp}@postgres:5432/${POSTGRES_DB:-food_ordering_api}?sslmode=disable"
      ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  demo-restaurant:
    build:
      context: .
      dockerfile: Dockerfile.restaurant
    ports:
      - "${DEMO_RESTAURANT_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_healthy
    environment:
      KITCHEN_API_URL: http://api:8080
      KITCHEN_API_KEY: ${DEMO_RESTAURANT_API_KEY:-demo-partner-key}
    command: ["./restaurant", "-addr=:8081", "-poll-interval=2s"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgresdata:
