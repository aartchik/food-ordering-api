services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    volumes:
      - postgresdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${FOOD_ORDERING_API_DB_DSN:?FOOD_ORDERING_API_DB_DSN is required}
      - up
    restart: "no"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      FOOD_ORDERING_API_DB_DSN: ${FOOD_ORDERING_API_DB_DSN:?FOOD_ORDERING_API_DB_DSN is required}
      FOOD_ORDERING_API_PARTNER_KEYS: ${FOOD_ORDERING_API_PARTNER_KEYS:?FOOD_ORDERING_API_PARTNER_KEYS is required}
      FOOD_ORDERING_API_REDIS_ADDR: redis:6379
      FOOD_ORDERING_API_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["./api", "-addr=:8080", "-env=production"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      default:
      public_proxy:
        aliases:
          - food-ordering-api

  demo-restaurant:
    image: ${RESTAURANT_IMAGE:?RESTAURANT_IMAGE is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      KITCHEN_API_URL: http://api:8080
      KITCHEN_API_KEY: ${DEMO_RESTAURANT_API_KEY:?DEMO_RESTAURANT_API_KEY is required}
    command: ["./restaurant", "-addr=:8081", "-poll-interval=2s"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgresdata:
  redisdata:

networks:
  public_proxy:
    external: true
