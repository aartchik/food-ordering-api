name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.images.outputs.api }}
      restaurant-image: ${{ steps.images.outputs.restaurant }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and publish demo restaurant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.restaurant
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-restaurant:${{ github.sha }}
            ghcr.io/${{ github.repository }}-restaurant:latest
          cache-from: type=gha,scope=restaurant
          cache-to: type=gha,mode=max,scope=restaurant
      - id: images
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "restaurant=ghcr.io/${GITHUB_REPOSITORY}-restaurant:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar -czf /tmp/food-ordering-api-deploy.tar.gz deploy migrations
          scp -i ~/.ssh/deploy_key /tmp/food-ordering-api-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/food-ordering-api-deploy.tar.gz"
      - name: Deploy images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ needs.publish.outputs.api-image }}
          RESTAURANT_IMAGE: ${{ needs.publish.outputs.restaurant-image }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$API_IMAGE' '$RESTAURANT_IMAGE'" < deploy/remote-deploy.sh
