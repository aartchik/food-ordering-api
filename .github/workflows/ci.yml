name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build binaries
        run: |
          go build ./cmd/api
          go build ./cmd/restaurant
      - name: Build containers
        run: |
          docker build -t food-ordering-api:ci .
          docker build -f Dockerfile.restaurant -t food-ordering-restaurant:ci .

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: food_ordering_api
          POSTGRES_USER: foodapp
          POSTGRES_PASSWORD: foodapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodapp -d food_ordering_api"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://foodapp:foodapp@127.0.0.1:5432/food_ordering_api?sslmode=disable
      FOOD_ORDERING_API_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests
        run: make test-integration
